services:
  traefik:
    image: traefik:v3.7.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-repousse_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.localhost`)
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  hanko:
    image: ghcr.io/teamhanko/hanko:latest
    command: serve --config /etc/hanko/config.yaml all
    environment:
      - CONFIG_FILE=/etc/hanko/config.yaml
    volumes:
      - ./hanko/config.yaml:/etc/hanko/config.yaml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.hanko.rule=Host(`auth.localhost`)
      - traefik.http.services.hanko.loadbalancer.server.port=8000
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-repousse_dev}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-repousse_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: 4000
      HANKO_API_URL: http://hanko:8000
      HANKO_ADMIN_URL: http://hanko:8001
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      WEBAPP_URL: ${WEBAPP_URL:-http://www.localhost}
      HELLOASSO_API_URL: ${HELLOASSO_API_URL:-}
      HELLOASSO_API_KEY: ${HELLOASSO_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://www.localhost,http://localhost:3000,http://localhost:3002}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.localhost`)
      - traefik.http.services.backend.loadbalancer.server.port=4000
    depends_on:
      postgres:
        condition: service_healthy
      hanko:
        condition: service_started
      mailpit:
        condition: service_started

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-http://auth.localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
      NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-http://auth.localhost}
    labels:
      - traefik.enable=true
      - traefik.http.routers.webapp.rule=Host(`www.localhost`)
      - traefik.http.services.webapp.loadbalancer.server.port=3000
    depends_on:
      - backend
      - hanko

volumes:
  postgres_data:

services:
  traefik:
    image: traefik:v3.7.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        # Lets other containers resolve the *.localhost hostnames to Traefik
        # itself, so a container-to-container call (e.g. docs fetching the
        # backend's OpenAPI spec at build time) is routed exactly like a
        # browser request — same Host header, same force_ssl exclude list.
        aliases:
          - api.localhost
          - www.localhost
          - auth.localhost
          - mail.localhost
          - docs.localhost

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-repousse_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.localhost`)
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`media.localhost`)
      - traefik.http.services.minio.loadbalancer.server.port=9000

  # One-shot job: creates the avatars bucket and makes it publicly readable
  # (download-only) so `avatar_url` values served to the browser need no
  # signing. Exits after running; `minio` healthy is its only dependency.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${MINIO_AVATARS_BUCKET:-avatars} &&
      mc anonymous set download local/${MINIO_AVATARS_BUCKET:-avatars}
      "

  hanko:
    image: ghcr.io/teamhanko/hanko:latest
    command: serve --config /etc/hanko/config.yaml all
    environment:
      - CONFIG_FILE=/etc/hanko/config.yaml
    volumes:
      - ./hanko/config.yaml:/etc/hanko/config.yaml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.hanko.rule=Host(`auth.localhost`)
      - traefik.http.services.hanko.loadbalancer.server.port=8000
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-repousse_dev}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-repousse_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-api.localhost}
      PHX_URL_SCHEME: http
      PHX_URL_PORT: "80"
      PHX_SERVER: "true"
      PORT: 4000
      HANKO_API_URL: http://hanko:8000
      HANKO_ADMIN_URL: http://hanko:8001
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      WEBAPP_URL: ${WEBAPP_URL:-http://www.localhost}
      HELLOASSO_API_URL: ${HELLOASSO_API_URL:-}
      HELLOASSO_API_KEY: ${HELLOASSO_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://www.localhost,http://localhost:3000,http://localhost:3002}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://media.localhost}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-avatars}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.localhost`)
      - traefik.http.services.backend.loadbalancer.server.port=4000
    depends_on:
      postgres:
        condition: service_healthy
      hanko:
        condition: service_started
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-http://auth.localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
      NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-http://auth.localhost}
    labels:
      - traefik.enable=true
      - traefik.http.routers.webapp.rule=Host(`www.localhost`)
      - traefik.http.services.webapp.loadbalancer.server.port=3000
    depends_on:
      - backend
      - hanko

  docs:
    build:
      context: ./docs/site
      dockerfile: Dockerfile
    environment:
      OPENAPI_SCHEMA_URL: http://api.localhost/api/v1/openapi
    labels:
      - traefik.enable=true
      - traefik.http.routers.docs.rule=Host(`docs.localhost`)
      - traefik.http.services.docs.loadbalancer.server.port=4321
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
